<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pipe Weight Calculator</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
<div class="bg-grid" aria-hidden="true"></div>
<main class="wcp">
  <header class="wc-hd">
    <h1>Pipe Weight Calculator</h1>
    <small>Official tool by Shreeji SteelTubes Pvt. Ltd.</small>
  </header>
  <div class="wc-bd">
    <div class="wc-box">
    <p class="wc-lb">Select pipe type:</p>
    <button type="button" class="wc-tg" id="wc-tg-mode" title="Tap to switch Round Pipe / Hollow Section"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg><span>Round Pipe</span></button>
    <p class="wc-lb">Enter size (mm):</p>
    <div class="wc-fg">
      <label class="wc-f wc-r"><span>Outer Diameter (OD)</span><input id="wc-od" inputmode="decimal" autocomplete="off" placeholder="60"></label>
      <label class="wc-f wc-h wc-hide"><span>Side A</span><input id="wc-a" inputmode="decimal" autocomplete="off" placeholder="40"></label>
      <label class="wc-f wc-h wc-hide"><span>Side B</span><input id="wc-b" inputmode="decimal" autocomplete="off" placeholder="20"></label>
      <label class="wc-f "><span>Thickness (THK)</span><input id="wc-t" inputmode="decimal" autocomplete="off" placeholder="3.2"></label>
      <label class="wc-f vr"><span>Rate per Kg (&#8377;)</span><input id="wc-rate" inputmode="decimal" autocomplete="off" placeholder="85"></label>
    </div>
    <p class="wc-lb">Show result as:</p>
    <button type="button" class="wc-tg" id="wc-tg-view" title="Tap to switch Rate / Weight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg><span>Rate (&#8377;)</span></button>
    <div class="wc-btns">
      <button type="button" class="wc-clr" id="wc-clr" title="Clear all fields and start again">Reset</button>
    </div>
    </div>
    <div class="wc-out" id="wc-out" aria-live="polite"></div>
    <div class="wc-foot">All calculations done on the server (Python / Flask)</div>
  </div>
</main>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
